name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Package Debug APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle Cache
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: wrapper

    - name: Ensure Environment Configuration (.env)
      run: |
        if [ ! -f .env ] && [ -f .env.example ]; then
          cp .env.example .env
          echo "Created .env from .env.example"
        fi

    - name: Restore Debug Keystore
      run: |
        if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
          base64 -d debug.keystore.base64 > debug.keystore
          echo "Restored debug.keystore from base64"
        fi

    - name: Grant Execute Permission to Gradle Wrapper
      run: chmod +x gradlew

    - name: Build Debug APK with Gradle
      run: ./gradlew assembleDebug --no-daemon --stacktrace

    - name: Verify APK Generated
      run: |
        ls -lh app/build/outputs/apk/debug/app-debug.apk

    - name: Upload Debug APK Artifact
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: noor-e-hidayah-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 14
